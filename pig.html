<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一六日誌・清管作業列印</title>
<style>
  @page { size: A4; margin: 0 }
  * { box-sizing: border-box }
  [hidden] { display: none !important }
  :root { --brand: #24506E; --brand-soft: #E2ECF2; --accent: #C4561B; --ok: #1F7A45; --ok-soft: #DDF1E4; --bad: #B3261E; --bad-soft: #FBE1DE;
          --ink: #16222B; --muted: #5A6A74; --line: #C9D1D6; --z: 1 }
  body { margin: 0; background: #e9ecef; color: var(--ink);
         font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
         -webkit-print-color-adjust: exact; print-color-adjust: exact }
  .bar { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid #ddd; padding: 10px 14px;
         display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 14px }
  .bar b { font-size: 16px }
  .bar label { display: flex; gap: 6px; align-items: center }
  .bar button { font: inherit; font-weight: 700; padding: 8px 18px; border: 0; border-radius: 8px; background: var(--brand); color: #fff; cursor: pointer; min-height: 40px }
  .bar button.sec { background: #e9ecef; color: #111 }
  .bar button:disabled { opacity: .6; cursor: wait }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto }
  .help { width: 100%; margin: 0; padding: 8px 12px; border-radius: 8px; background: #fff4d6; color: #5c4300; font-size: 14px; line-height: 1.6 }
  .err { max-width: 560px; margin: 40px auto; padding: 20px; background: #fff; border-radius: 10px; font-size: 16px; line-height: 1.6 }
  .pages { padding: 16px 0 40px; zoom: var(--z) }
  .sheet { position: relative; width: 210mm; height: 297mm; margin: 0 auto 16px; background: #fff; overflow: hidden; padding: 9mm 10mm 8mm;
           display: flex; flex-direction: column; box-shadow: 0 1px 6px rgba(0,0,0,.15); break-after: page; page-break-after: always }
  .sheet:last-child { break-after: auto; page-break-after: auto }
  .ph { flex: none; border-bottom: .6mm solid var(--brand); padding-bottom: 2mm; margin-bottom: 3mm }
  .ph h1 { margin: 0; font-size: 6.2mm; line-height: 1.25; color: var(--brand) }
  .ph .sub { margin-top: 1mm; font-size: 3.4mm; color: var(--muted); display: flex; flex-wrap: wrap; gap: 1mm 4mm }
  .ph .sub b { color: var(--ink) }
  .legend { margin-top: 1.6mm; display: flex; flex-wrap: wrap; gap: 1.2mm 4mm; font-size: 3mm; color: var(--muted); align-items: center }
  .pf { flex: none; margin-top: 2mm; font-size: 2.8mm; color: #8a969d; display: flex; justify-content: space-between }
  .body { flex: 1; min-height: 0; display: flex; gap: 5mm }
  .col { flex: 1; min-width: 0; overflow: hidden; display: flex; flex-direction: column; align-items: stretch }
  /* 流程圖 */
  .phase { margin: 1.4mm 0 1mm; padding: 1mm 2.4mm; border-radius: 1.2mm; background: var(--brand); color: #fff; font-weight: 800; font-size: 3.5mm; letter-spacing: .3mm }
  .phase.cont { background: var(--brand-soft); color: var(--brand) }
  .fb { border: .35mm solid var(--line); border-radius: 2mm; padding: 1.6mm 2.2mm; display: grid; grid-template-columns: 6.4mm 1fr; gap: .8mm 2mm; background: #fff }
  .fb.safe { border: .6mm solid var(--bad); background: #fffafa }
  .fb .no { width: 6.4mm; height: 6.4mm; border-radius: 1.6mm; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 800; font-size: 3.4mm }
  .fb.safe .no { background: var(--bad); color: #fff }
  .fb .tx { font-size: 3.5mm; line-height: 1.38; font-weight: 600 }
  .fb .mt { grid-column: 2; display: flex; flex-wrap: wrap; gap: 1mm 1.4mm; align-items: center }
  .fb .tl { grid-column: 2; font-size: 2.9mm; color: var(--muted); line-height: 1.35 }
  .arr { text-align: center; color: #9aa6ad; font-size: 3.2mm; line-height: 1; margin: .6mm 0 }
  .vp { display: inline-flex; align-items: center; gap: 1mm; padding: .4mm 2mm; border-radius: 5mm; font-weight: 800; font-size: 3.2mm; border: .3mm solid transparent }
  .vp.open { background: var(--ok-soft); color: var(--ok); border-color: var(--ok) }
  .vp.shut { background: var(--bad-soft); color: var(--bad); border-color: var(--bad) }
  .vp.other { background: #eef1f3; color: var(--ink); border-color: #9aa6ad }
  .rt { display: inline-block; padding: .2mm 1.6mm; border-radius: 1mm; background: var(--brand-soft); color: var(--brand); font-size: 2.9mm; font-weight: 700 }
  .sf { display: inline-block; padding: .2mm 1.6mm; border-radius: 1mm; background: var(--bad); color: #fff; font-size: 2.9mm; font-weight: 800 }
  .cont-mark { font-size: 2.8mm; color: var(--muted); margin-bottom: 1mm }
  /* 任務卡 */
  .cards { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 0 }
  .card { position: relative; border: .3mm dashed #9aa6ad; padding: 3mm; display: flex; flex-direction: column; min-height: 0; overflow: hidden }
  .card.empty { border-color: #eef0f2 }
  .ch { flex: none; border-radius: 2mm; background: var(--brand); color: #fff; padding: 2mm 3mm; margin-bottom: 2mm }
  .ch .rn { font-size: 6.4mm; font-weight: 900; line-height: 1.15 }
  .ch .rw { font-size: 3mm; opacity: .9; margin-top: .6mm }
  .ch.cont { background: var(--brand-soft); color: var(--brand) }
  .who { flex: none; display: flex; gap: 3mm; font-size: 3mm; color: var(--muted); margin-bottom: 1.6mm }
  .who span { flex: 1; border-bottom: .3mm solid #9aa6ad; padding-bottom: .4mm }
  .cb { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column }
  .duty { font-size: 3.1mm; line-height: 1.4; padding: 1.2mm 2mm; background: #f4f6f8; border-radius: 1.4mm; margin-bottom: 1.4mm }
  .sec { font-size: 3.1mm; font-weight: 800; color: var(--accent); margin: 1.4mm 0 .6mm; border-bottom: .3mm solid #e1e6e9; padding-bottom: .4mm }
  .tk { display: grid; grid-template-columns: 3.6mm 5mm 1fr; gap: 1.2mm; align-items: start; font-size: 3.2mm; line-height: 1.35; padding: .7mm 0 }
  .tk .bx, .ck .bx { width: 3.6mm; height: 3.6mm; border: .35mm solid #333; border-radius: .6mm; margin-top: .2mm }
  .tk .n { font-weight: 800; color: var(--brand); font-size: 3mm; text-align: right }
  .tk .t .vp { font-size: 2.8mm; padding: .1mm 1.4mm; margin-left: .6mm }
  .tk.safe .t { font-weight: 700 }
  .tk.safe .n { color: var(--bad) }
  .ck { display: grid; grid-template-columns: 3.6mm 1fr auto; gap: 1.4mm; align-items: start; font-size: 3.1mm; line-height: 1.35; padding: .5mm 0 }
  .ck .q { font-weight: 800; white-space: nowrap }
  .ck .s { color: var(--muted) }
  .every { font-size: 2.9mm; line-height: 1.4; color: var(--ink) }
  /* 準備清單 */
  .lh { margin: 1.6mm 0 .8mm; padding: .8mm 2.2mm; border-left: 1mm solid var(--accent); background: #f6f7f8; font-weight: 800; font-size: 3.4mm }
  .lh small { font-weight: 400; color: var(--muted); margin-left: 1.6mm }
  .lc { font-size: 2.9mm; color: var(--muted); margin: .8mm 0 .2mm 1mm; font-weight: 700 }
  .lr { display: grid; grid-template-columns: 3.6mm 1fr auto; gap: 1.6mm; align-items: start; font-size: 3.2mm; line-height: 1.35; padding: .8mm 1mm; border-bottom: .2mm solid #eceff1 }
  .lr .bx { width: 3.6mm; height: 3.6mm; border: .35mm solid #333; border-radius: .6mm; margin-top: .2mm }
  .lr .s { color: var(--muted); font-size: 2.9mm }
  .lr .q { font-weight: 800; white-space: nowrap; text-align: right }
  .lr .q small { display: block; font-weight: 400; color: var(--muted); font-size: 2.7mm }
  @media print {
    body { background: #fff }
    .bar, .err { display: none !important }
    .pages { padding: 0; zoom: 1 }
    .sheet { margin: 0; box-shadow: none }
  }
</style>
</head>
<body>
<div class="bar" id="bar" hidden>
  <b>清管作業列印</b>
  <span id="summary"></span>
  <label><input type="checkbox" id="pFlow" checked> 流程圖</label>
  <label><input type="checkbox" id="pCards" checked> 任務卡</label>
  <label><input type="checkbox" id="pList" checked> 準備清單</label>
  <span class="acts">
    <button type="button" id="print">🖨️ 列印</button>
    <button type="button" id="pdf" class="sec">📄 下載 PDF</button>
    <button type="button" id="close" class="sec">✕ 關閉</button>
  </span>
  <p class="help" id="help" hidden>這個畫面（手機主畫面捷徑、LINE 等 App 內建的瀏覽器）沒辦法直接列印。請按「📄 下載 PDF」：
    手機會跳出分享選單，選「列印」或存到檔案再印；電腦會下載 PDF。列印時縮放選「實際大小／100%」。</p>
</div>
<div class="pages" id="pages"></div>
<script>
(function () {
  'use strict';
  function fromB64url(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  // 所有文字都用 textContent，不用 innerHTML（資料來自網址，避免注入）
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    for (var i = 3; i < arguments.length; i++) if (arguments[i]) n.appendChild(arguments[i]);
    return n;
  }
  var pagesEl = document.getElementById('pages'), D = null;
  try { D = JSON.parse(fromB64url(location.hash.slice(1))); } catch (e) { D = null; }
  if (!D || !D.v) {
    pagesEl.appendChild(el('div', 'err', '沒有列印資料。請從一六日誌系統「更多 → 清管範本 → 列印」打開這一頁。'));
    return;
  }
  var procs = D.procs || [], lists = D.lists || [], roles = D.roles || [];

  function vpill(valve, action) {
    var cls = /關/.test(action) ? 'shut' : (/開/.test(action) ? 'open' : 'other');
    return el('span', 'vp ' + cls, valve + (action ? '　' + action : ''));
  }
  function qtyText(x) {
    if (x.qty === '' || x.qty === null || x.qty === undefined) return '';
    var q = x.qty + (x.unit ? ' ' + x.unit : '');
    return x.calc === '每人' ? q + '／人' : (x.calc === '每趟' ? q + '／趟' : q);
  }
  var pageNo = 0, sheets = [];
  function sheet(title, subBits, legend) {
    var s = el('div', 'sheet'), ph = el('div', 'ph', null, el('h1', null, title));
    if (subBits && subBits.length) {
      var sub = el('div', 'sub');
      subBits.forEach(function (b) { if (b) sub.appendChild(b.nodeType ? b : el('span', null, b)); });
      ph.appendChild(sub);
    }
    if (legend) ph.appendChild(legend);
    var body = el('div', 'body');
    s.appendChild(ph); s.appendChild(body);
    s.appendChild(el('div', 'pf', null, el('span', null, (D.title || '清管作業') + '　' + (D.date || '')), el('span', 'pno')));
    pagesEl.appendChild(s); sheets.push(s);
    return body;
  }
  function over(c) { return c.scrollHeight > c.clientHeight + 1; }
  /**
   * 把一串區塊依序放進容器（欄、卡片）；放不下就換下一個容器。
   * next()：回傳下一個空容器；before(c, b)：要不要先放箭頭；cont(b)：換容器時開頭加的「接續」標示
   */
  function flow(blocks, next, before, cont) {
    var cur = next(), heads = [];   // heads：容器最後面連續的標題（標題要跟著下一個區塊走，不能單獨留在底部）
    blocks.forEach(function (b) {
      var pre = before ? before(cur, b) : null;
      if (pre) cur.appendChild(pre);
      cur.appendChild(b.el);
      if (over(cur) && cur.children.length > (pre ? 2 : 1) + heads.length) {
        cur.removeChild(b.el); if (pre) cur.removeChild(pre);
        heads.forEach(function (h) { cur.removeChild(h); });
        cur = next();
        var h = cont ? cont(b, heads.length > 0) : null;
        if (h) cur.appendChild(h);
        heads.forEach(function (x) { cur.appendChild(x); });
        cur.appendChild(b.el);
      }
      heads = b.head ? heads.concat([b.el]) : [];
    });
  }
  function sizeBits(p) {
    var out = [];
    if (p.size && p.size.label) out.push(el('span', null, null, el('b', null, p.size.label)));
    if (p.size && p.size.bolt) out.push(el('span', null, '螺栓 ' + p.size.bolt));
    if (p.size && p.size.nut) out.push(el('span', null, '扳手 ' + p.size.nut));
    return out;
  }

  /* ---------- 流程圖：每個程序 2 欄，階段色帶＋步驟方塊＋箭頭 ---------- */
  function drawFlow(p) {
    var legend = el('div', 'legend', null, vpill('閥門', '開'), vpill('閥門', '關'), el('span', 'sf', '⚠ 安全確認'), el('span', null, '紅框＝確認完才能做下一步'), el('span', 'rt', '角色'));
    var blocks = [], phase = null;
    p.steps.forEach(function (s, i) {
      if (s.phase !== phase) { phase = s.phase; if (phase) blocks.push({ kind: 'phase', head: true, phase: phase, el: el('div', 'phase', phase) }); }
      var box = el('div', 'fb' + (s.safety ? ' safe' : ''), null, el('div', 'no', i + 1), el('div', 'tx', s.text));
      var mt = el('div', 'mt');
      if (s.valve) mt.appendChild(vpill(s.valve, s.action));
      if (s.role) mt.appendChild(el('span', 'rt', s.role));
      if (s.safety) mt.appendChild(el('span', 'sf', '⚠ 安全確認'));
      if (mt.children.length) box.appendChild(mt);
      if (s.tools) box.appendChild(el('div', 'tl', '🔧 ' + s.tools));
      blocks.push({ kind: 'step', phase: phase, el: box });
    });
    var cols = [];
    function next() {
      if (!cols.length) {
        var body = sheet(p.name, [p.scope ? el('span', null, null, el('b', null, p.scope)) : null].concat(sizeBits(p)).concat([el('span', null, '共 ' + p.steps.length + ' 步')]), legend.cloneNode(true));
        cols = [el('div', 'col'), el('div', 'col')];
        body.appendChild(cols[0]); body.appendChild(cols[1]);
      }
      return cols.shift();
    }
    flow(blocks, next,
      function (c, b) { var last = c.lastElementChild; return b.kind === 'step' && last && /\bfb\b/.test(last.className) ? el('div', 'arr', '▼') : null; },
      function (b, carried) { return carried ? null : (b.kind === 'step' && b.phase ? el('div', 'phase cont', b.phase + '（接上欄）') : el('div', 'cont-mark', '▼ 接上欄')); });
  }

  /* ---------- 任務卡：每個角色一張（放不下就續下一張），一頁 4 張，沿虛線剪開 ---------- */
  function roleList() {
    var out = [], seen = {};
    roles.forEach(function (r) { if (!seen[r.name]) { seen[r.name] = 1; out.push(r); } });
    procs.forEach(function (p) { p.steps.forEach(function (s) { if (s.role && !seen[s.role]) { seen[s.role] = 1; out.push({ name: s.role, where: '', duty: '' }); } }); });
    lists.forEach(function (l) { l.items.forEach(function (x) { if (x.role && !seen[x.role]) { seen[x.role] = 1; out.push({ name: x.role, where: '', duty: '' }); } }); });
    return out;
  }
  function everyone() {
    var out = [];
    lists.forEach(function (l) { l.items.forEach(function (x) { if (x.calc === '每人' && !x.role) out.push(x.name + (x.qty !== '' && x.qty !== 1 ? ' ' + x.qty + (x.unit || '') : '')); }); });
    return out;
  }
  function drawCards() {
    var slots = [], every = everyone();
    function newPage() {
      var body = sheet('任務卡', [el('span', null, '每人一張，沿虛線剪開；做完一步打勾')]);
      var g = el('div', 'cards');
      for (var i = 0; i < 4; i++) { var c = el('div', 'card empty'); g.appendChild(c); slots.push(c); }
      body.appendChild(g);
    }
    function slot(role, cont) {
      if (!slots.length) newPage();
      var c = slots.shift();
      c.className = 'card';
      var ch = el('div', 'ch' + (cont ? ' cont' : ''), null, el('div', 'rn', role.name + (cont ? '（續）' : '')));
      if (role.where && !cont) ch.appendChild(el('div', 'rw', '位置：' + role.where));
      c.appendChild(ch);
      if (!cont) c.appendChild(el('div', 'who', null, el('span', null, '姓名'), el('span', null, '日期')));
      var b = el('div', 'cb'); c.appendChild(b);
      return b;
    }
    roleList().forEach(function (r) {
      var blocks = [];
      if (r.duty) blocks.push({ el: el('div', 'duty', r.duty) });
      var tools = [], seenT = {};
      procs.forEach(function (p) {
        var mine = p.steps.map(function (s, i) { return { s: s, n: i + 1 }; }).filter(function (x) { return x.s.role === r.name; });
        if (!mine.length) return;
        blocks.push({ head: true, el: el('div', 'sec', p.name.replace(/（草稿）$/, '') + '：你的步驟') });
        mine.forEach(function (x) {
          var t = el('div', 't', (x.s.safety ? '⚠ ' : '') + x.s.text);
          if (x.s.valve) t.appendChild(vpill(x.s.valve, x.s.action));
          blocks.push({ el: el('div', 'tk' + (x.s.safety ? ' safe' : ''), null, el('div', 'bx'), el('div', 'n', x.n), t) });
          String(x.s.tools || '').split(/[、,，]/).forEach(function (k) { k = k.trim(); if (k && !seenT[k]) { seenT[k] = 1; tools.push(k); } });
        });
      });
      var items = [];
      lists.forEach(function (l) { l.items.forEach(function (x) { if (x.role === r.name) items.push(x); }); });
      if (tools.length || items.length) {
        blocks.push({ head: true, el: el('div', 'sec', '要帶的東西') });
        items.forEach(function (x) { blocks.push({ el: el('div', 'ck', null, el('div', 'bx'), el('div', null, x.name + (x.spec ? '　' + x.spec : '')), el('div', 'q', qtyText(x))) }); seenT[x.name] = 1; });
        tools.forEach(function (k) { if (!items.some(function (x) { return k.indexOf(x.name) === 0; })) blocks.push({ el: el('div', 'ck', null, el('div', 'bx'), el('div', null, k), el('div', 'q', '')) }); });
      }
      if (!blocks.length) blocks.push({ el: el('div', 'duty', '依指揮官指示') });
      if (/追豬/.test(r.name)) {
        blocks.push({ head: true, el: el('div', 'sec', '我的位置') });
        ['負責 AGM 點', '回報給', '對講機頻道'].forEach(function (k) { blocks.push({ el: el('div', 'who', null, el('span', null, k)) }); });
      }
      if (every.length) { blocks.push({ head: true, el: el('div', 'sec', '每個人都要帶') }); blocks.push({ el: el('div', 'every', every.join('、')) }); }
      var first = true;
      flow(blocks, function () { var b = slot(r, !first); first = false; return b; });
    });
  }

  /* ---------- 準備清單：所有清單，2 欄，可以勾 ---------- */
  function drawList() {
    var blocks = [];
    lists.forEach(function (l) {
      blocks.push({ head: true, el: el('div', 'lh', l.name.replace(/（草稿）$/, ''), l.scope ? el('small', null, l.scope) : null) });
      var cat = null;
      l.items.forEach(function (x) {
        if (x.cat && x.cat !== cat) { cat = x.cat; blocks.push({ head: true, el: el('div', 'lc', cat) }); }
        var q = el('div', 'q', qtyText(x));
        if (x.role) q.appendChild(el('small', null, x.role));
        blocks.push({ el: el('div', 'lr', null, el('div', 'bx'), el('div', null, null, el('span', null, x.name), x.spec ? el('div', 's', x.spec) : null), q) });
      });
    });
    var cols = [];
    function next() {
      if (!cols.length) {
        var body = sheet('準備清單（出發前逐項打勾）', [el('span', null, '「／趟」＝乘上趟數；「／人」＝乘上人數')]);
        cols = [el('div', 'col'), el('div', 'col')];
        body.appendChild(cols[0]); body.appendChild(cols[1]);
      }
      return cols.shift();
    }
    flow(blocks, next);
  }

  function render() {
    pagesEl.innerHTML = ''; sheets = [];
    var z = getComputedStyle(document.documentElement).getPropertyValue('--z');
    document.documentElement.style.setProperty('--z', '1');   // 排版時用原尺寸量高度
    if (document.getElementById('pFlow').checked) procs.forEach(drawFlow);
    if (document.getElementById('pCards').checked) drawCards();
    if (document.getElementById('pList').checked && lists.length) drawList();
    sheets.forEach(function (s, i) { var n = s.querySelector('.pno'); if (n) n.textContent = (i + 1) + ' / ' + sheets.length; });
    document.getElementById('summary').textContent = sheets.length + ' 頁（A4）';
    fit();
  }
  function fit() {
    var w = document.documentElement.clientWidth, mm = 96 / 25.4;
    document.documentElement.style.setProperty('--z', String(Math.min(1, (w - 16) / (210 * mm))));
  }
  window.addEventListener('resize', fit);
  ['pFlow', 'pCards', 'pList'].forEach(function (id) { document.getElementById(id).addEventListener('change', render); });

  /* ---------- PDF：每頁拍成圖（html2canvas），組成 A4 PDF；手機不能直接列印時用 ---------- */
  function load(url, sri, test) {
    if (test()) return Promise.resolve();
    return new Promise(function (ok, bad) {
      var s = document.createElement('script'); s.src = url; s.integrity = sri; s.crossOrigin = 'anonymous';
      s.onload = ok; s.onerror = function () { bad(new Error('PDF 產生器載入失敗，請確認網路後再試一次')); };
      document.head.appendChild(s);
    });
  }
  function makePdf() {
    return load('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk', function () { return !!window.jspdf; })
      .then(function () { return load('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', 'sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H', function () { return !!window.html2canvas; }); })
      .then(function () {
        var doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', compress: true }), z = getComputedStyle(document.documentElement).getPropertyValue('--z');
        document.documentElement.style.setProperty('--z', '1');
        var i = 0;
        function one() {
          if (i >= sheets.length) { document.documentElement.style.setProperty('--z', z); return doc.output('blob'); }
          var s = sheets[i];
          return window.html2canvas(s, { scale: 2, backgroundColor: '#ffffff', useCORS: false, logging: false }).then(function (cv) {
            if (i) doc.addPage();
            doc.addImage(cv.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
            cv.width = cv.height = 1; i++;
            return one();
          });
        }
        return one();
      });
  }
  var pdfBtn = document.getElementById('pdf');
  pdfBtn.addEventListener('click', function () {
    var old = pdfBtn.textContent;
    pdfBtn.disabled = true; pdfBtn.textContent = '產生中…';
    makePdf().then(function (blob) {
      var d = new Date(), name = 'pigging_' + d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2) + '.pdf';
      var file = typeof File === 'function' ? new File([blob], name, { type: 'application/pdf' }) : null;
      var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      if (touch && file && navigator.canShare && navigator.canShare({ files: [file] })) return navigator.share({ files: [file], title: name }).catch(function () { /* 取消 */ });
      var url = URL.createObjectURL(blob), a = el('a');
      a.href = url; a.download = name; a.hidden = true; document.body.appendChild(a); a.click();
      setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 60000);
    }).catch(function (e) { alert(e && e.message || 'PDF 產生失敗，請再試一次'); })
      .then(function () { pdfBtn.disabled = false; pdfBtn.textContent = old; });
  });
  var printing = false, help = document.getElementById('help');
  window.addEventListener('beforeprint', function () { printing = true; });
  document.getElementById('print').addEventListener('click', function () {
    printing = false;
    try { window.print(); } catch (e) { /* 不支援 */ }
    setTimeout(function () { if (!printing) help.hidden = false; }, 1200);
  });
  document.getElementById('close').addEventListener('click', function () {
    try { window.close(); } catch (e) { /* ignore */ }
    setTimeout(function () { if (history.length > 1) history.back(); }, 300);
  });
  document.getElementById('bar').hidden = false;
  render();
})();
</script>
</body>
