<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一六日誌・清管作業列印</title>
<script src="qrcode.js"></script>
<style>
  @page { size: A4; margin: 0 }
  * { box-sizing: border-box }
  [hidden] { display: none !important }
  :root { --brand: #24506E; --brand-soft: #E2ECF2; --accent: #C4561B; --ok: #1F7A45; --ok-soft: #DDF1E4; --bad: #B3261E; --bad-soft: #FBE1DE;
          --ink: #16222B; --muted: #5A6A74; --line: #C9D1D6; --z: 1 }
  body { margin: 0; background: #e9ecef; color: var(--ink);
         font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
         -webkit-print-color-adjust: exact; print-color-adjust: exact }
  .bar { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid #ddd; padding: 10px 14px;
         display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 14px }
  .bar b { font-size: 16px }
  .bar label { display: flex; gap: 6px; align-items: center }
  .bar button { font: inherit; font-weight: 700; padding: 8px 18px; border: 0; border-radius: 8px; background: var(--brand); color: #fff; cursor: pointer; min-height: 40px }
  .bar button.sec { background: #e9ecef; color: #111 }
  .bar button:disabled { opacity: .6; cursor: wait }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto }
  .help { width: 100%; margin: 0; padding: 8px 12px; border-radius: 8px; background: #fff4d6; color: #5c4300; font-size: 14px; line-height: 1.6 }
  .err { max-width: 560px; margin: 40px auto; padding: 20px; background: #fff; border-radius: 10px; font-size: 16px; line-height: 1.6 }
  .pages { padding: 16px 0 40px; zoom: var(--z) }
  .sheet { position: relative; width: 210mm; height: 297mm; margin: 0 auto 16px; background: #fff; overflow: hidden; padding: 9mm 10mm 8mm;
           display: flex; flex-direction: column; box-shadow: 0 1px 6px rgba(0,0,0,.15); break-after: page; page-break-after: always }
  .sheet:last-child { break-after: auto; page-break-after: auto }
  .ph { flex: none; border-bottom: .6mm solid var(--brand); padding-bottom: 2mm; margin-bottom: 3mm }
  .ph h1 { margin: 0; font-size: 6.2mm; line-height: 1.25; color: var(--brand) }
  .ph .sub { margin-top: 1mm; font-size: 3.4mm; color: var(--muted); display: flex; flex-wrap: wrap; gap: 1mm 4mm }
  .ph .sub b { color: var(--ink) }
  .legend { margin-top: 1.6mm; display: flex; flex-wrap: wrap; gap: 1.2mm 4mm; font-size: 3mm; color: var(--muted); align-items: center }
  .pf { flex: none; margin-top: 2mm; font-size: 2.8mm; color: #8a969d; display: flex; justify-content: space-between }
  .body { flex: 1; min-height: 0; display: flex; gap: 5mm }
  .col { flex: 1; min-width: 0; overflow: hidden; display: flex; flex-direction: column; align-items: stretch }
  .vp { display: inline-flex; align-items: center; gap: 1mm; padding: .4mm 2.2mm; border-radius: 5mm; font-weight: 800; font-size: 3.4mm; border: .35mm solid transparent; white-space: nowrap }
  .vp.open { background: var(--ok-soft); color: var(--ok); border-color: var(--ok) }
  .vp.shut { background: var(--bad-soft); color: var(--bad); border-color: var(--bad) }
  .vp.other { background: #eef1f3; color: var(--ink); border-color: #9aa6ad }
  .vp.big { font-size: 4.2mm; padding: .6mm 3mm }
  .sf { display: inline-block; padding: .2mm 1.6mm; border-radius: 1mm; background: var(--bad); color: #fff; font-size: 2.9mm; font-weight: 800 }
  .rpt { display: inline-block; padding: .2mm 1.6mm; border-radius: 1mm; background: #fde9da; color: #8a3a0c; font-size: 2.9mm; font-weight: 800 }
  .stg { display: inline-block; padding: .1mm 1.4mm; border-radius: 1mm; font-size: 2.8mm; font-weight: 800; background: #eef1f3; color: var(--ink) }
  .stg.s-launch { background: #fde9da; color: #8a3a0c } .stg.s-recv { background: var(--ok-soft); color: var(--ok) }
  .stg.s-line { background: #fff1c9; color: #6b4b00 } .stg.s-all { background: var(--brand-soft); color: var(--brand) }
  /* 個人任務卡：A4 一頁兩張（半頁），步驟多就整頁；沿虛線剪開 */
  .sheet.cardpage { padding: 0; display: block }
  .slot { position: absolute; left: 0; width: 210mm; overflow: hidden }
  .slot.top { top: 0; height: 148.5mm; border-bottom: .3mm dashed #9aa6ad }
  .slot.bot { top: 148.5mm; height: 148.5mm }
  .slot.full { top: 0; height: 297mm }
  .slot .cut { position: absolute; right: 4mm; bottom: .6mm; font-size: 2.4mm; color: #9aa6ad }
  .pcard { position: absolute; inset: 0; padding: 6mm 8mm 5mm; display: flex; flex-direction: column }
  .pch { flex: none; display: grid; grid-template-columns: 1fr auto; gap: 1mm 4mm; align-items: start; border-radius: 2.4mm; background: var(--brand); color: #fff; padding: 2.4mm 4mm; margin-bottom: 2mm }
  .pch.cont { background: var(--brand-soft); color: var(--brand) }
  .pcn { font-size: 7.4mm; font-weight: 900; line-height: 1.1 }
  .pcn.blank { font-size: 4mm; font-weight: 700; opacity: .9; padding-top: 2mm }
  .pcn.blank i { display: inline-block; width: 46mm; border-bottom: .4mm solid currentColor; margin-left: 2mm }
  .pcp { font-size: 3.6mm; font-weight: 700; margin-top: .8mm }
  .pci { text-align: right; font-size: 3mm; line-height: 1.5; opacity: .95 }
  .pci b { font-size: 4.4mm }
  .pnote { flex: none; display: flex; flex-wrap: wrap; gap: 1mm 4mm; font-size: 3.2mm; line-height: 1.45; padding: 1.2mm 2.4mm; background: #f4f6f8; border-radius: 1.4mm; margin-bottom: 1.6mm }
  .pnote b { color: var(--accent) }
  .pcb { flex: 1; min-height: 0; display: flex; gap: 5mm }
  .pcol { flex: 1; min-width: 0; overflow: hidden; display: flex; flex-direction: column }
  .pcol > *, .col > * { flex: none }   /* 放不下要換欄，不能被壓扁 */
  .pcf { flex: none; margin-top: 1.2mm; font-size: 2.6mm; color: #8a969d; display: flex; justify-content: space-between }
  .ph2 { margin: 1.2mm 0 .6mm; padding: .7mm 2.4mm; border-radius: 1.2mm; background: var(--brand); color: #fff; font-weight: 800; font-size: 3.3mm }
  .ph2.cont { background: var(--brand-soft); color: var(--brand) }
  .wait { margin: .6mm 0 .2mm 9.6mm; font-size: 3mm; line-height: 1.4; color: var(--muted); border-left: .6mm solid #c9d1d6; padding-left: 1.6mm }
  .wait b { color: var(--ink) }
  .srow { display: grid; grid-template-columns: 4.2mm 5mm 1fr; gap: 1.2mm; align-items: start; padding: .9mm 0; border-bottom: .2mm solid #eceff1 }
  .srow .bx { width: 4.2mm; height: 4.2mm; border: .4mm solid #333; border-radius: .7mm; margin-top: .3mm }
  .srow .no { font-weight: 800; color: var(--brand); font-size: 3mm; text-align: right; padding-top: .5mm }
  .srow .sb { display: grid; gap: .6mm; min-width: 0 }
  .srow .tx { font-size: 3.6mm; line-height: 1.4; font-weight: 600 }
  .srow .tg { display: flex; flex-wrap: wrap; gap: 1mm }
  .srow.safe .no { color: var(--bad) }
  .srow.safe .bx { border-color: var(--bad) }
  .sec { font-size: 3.2mm; font-weight: 800; color: var(--accent); margin: 1.6mm 0 .6mm; border-bottom: .3mm solid #e1e6e9; padding-bottom: .4mm }
  .ck { display: grid; grid-template-columns: 3.6mm 1fr auto; gap: 1.4mm; align-items: start; font-size: 3.2mm; line-height: 1.35; padding: .5mm 0 }
  .ck .bx { width: 3.6mm; height: 3.6mm; border: .35mm solid #333; border-radius: .6mm; margin-top: .2mm }
  .ck .q { font-weight: 800; white-space: nowrap }
  .every { font-size: 3mm; line-height: 1.45 }
  .agm { display: grid; grid-template-columns: 1fr 1fr; font-size: 3mm; border: .3mm solid #9aa6ad; border-radius: 1mm; overflow: hidden }
  .agm span { padding: 1.4mm 2mm; border-bottom: .3mm solid #d5dbdf; min-height: 6.4mm }
  .agm span:nth-child(odd) { border-right: .3mm solid #d5dbdf }
  .agm .h { background: #f4f6f8; font-weight: 800; min-height: 0 }
  /* 指揮總表 */
  .roster { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1mm 3mm; font-size: 3mm; line-height: 1.4; padding: 1.6mm 2.4mm; background: #f4f6f8; border-radius: 1.4mm; margin-bottom: 2mm }
  .roster b { font-size: 3.3mm }
  .crow { display: grid; grid-template-columns: 4mm 6mm 12mm 34mm 1fr 9mm; gap: 1.6mm; align-items: start; font-size: 3.2mm; line-height: 1.38; padding: 1mm 0; border-bottom: .2mm solid #e3e7ea }
  .crow .bx { width: 4mm; height: 4mm; border: .35mm solid #333; border-radius: .6mm }
  .crow .no { font-weight: 800; color: var(--brand); text-align: right }
  .crow .who { font-weight: 700 }
  .crow .who small { display: block; font-weight: 400; color: var(--muted) }
  .crow .tm { border-bottom: .3mm solid #b9c2c8; height: 4mm }
  .crow.safe .no { color: var(--bad) }
  .crow.head { font-weight: 800; color: var(--muted); font-size: 2.8mm; border-bottom: .4mm solid var(--brand) }
  /* 準備清單 */
  .lh { margin: 1.6mm 0 .8mm; padding: .8mm 2.2mm; border-left: 1mm solid var(--accent); background: #f6f7f8; font-weight: 800; font-size: 3.4mm }
  .lh small { font-weight: 400; color: var(--muted); margin-left: 1.6mm }
  .lc { font-size: 2.9mm; color: var(--muted); margin: .8mm 0 .2mm 1mm; font-weight: 700 }
  .lr { display: grid; grid-template-columns: 3.6mm 1fr auto; gap: 1.6mm; align-items: start; font-size: 3.2mm; line-height: 1.35; padding: .8mm 1mm; border-bottom: .2mm solid #eceff1 }
  .lr .bx { width: 3.6mm; height: 3.6mm; border: .35mm solid #333; border-radius: .6mm; margin-top: .2mm }
  .lr .s { color: var(--muted); font-size: 2.9mm }
  .lr .q { font-weight: 800; white-space: nowrap; text-align: right }
  .lr .q small { display: block; font-weight: 400; color: var(--muted); font-size: 2.7mm }
  /* 派工單：一份派工一頁（人多會接到下一頁）；編號印成 QR 和一維條碼 */
  .dtop { display: grid; grid-template-columns: 1fr 50mm; gap: 5mm; align-items: start; flex: none }
  .dinfo { display: grid; grid-template-columns: 30mm 1fr; border: .3mm solid var(--line); border-radius: 1.6mm; overflow: hidden; font-size: 3.4mm; line-height: 1.4 }
  .dinfo > div { padding: 1.1mm 2.2mm; border-bottom: .2mm solid #e3e7ea }
  .dinfo .k { background: #f4f6f7; color: var(--muted); font-weight: 700 }
  .dinfo .v b { font-size: 4.2mm }
  .dcodes { display: grid; justify-items: center; gap: 1.2mm; text-align: center }
  .dcodes canvas.dqr { width: 38mm; height: 38mm }
  .dcodes canvas.dbc { width: 50mm; height: 12mm }
  .dno { font-size: 6.4mm; font-weight: 900; letter-spacing: .3mm; font-family: ui-monospace, Menlo, Consolas, monospace }
  .dhint { font-size: 2.6mm; color: var(--muted); line-height: 1.35 }
  .dsec { flex: none; margin: 2.8mm 0 1mm; font-weight: 800; font-size: 3.8mm; color: var(--brand); border-left: 1mm solid var(--accent); padding-left: 2mm }
  .drow { flex: none; display: grid; grid-template-columns: 17mm 36mm 1fr 9mm 38mm; font-size: 3.4mm; border-bottom: .2mm solid #d9dfe2; align-items: stretch; min-height: 7mm }
  .drow > span { padding: .6mm 1.6mm; display: flex; align-items: center }
  .drow.h { font-weight: 800; color: var(--muted); font-size: 3mm; border-bottom: .4mm solid var(--brand); min-height: 6mm }
  .drow .sig { border-left: .2mm dashed #b8c2c8 }
  .drow b { font-size: 3.8mm }
  .dgrid { flex: none; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3mm; font-size: 3.1mm; line-height: 1.45 }
  .dbox { border: .3mm solid var(--line); border-radius: 1.6mm; padding: 1.6mm 2.2mm; min-height: 16mm }
  .dbox b { display: block; color: var(--brand); margin-bottom: .6mm; font-size: 3.3mm }
  .dbox .no { color: #8a969d }
  .dexec { flex: none; display: grid; grid-template-columns: 12mm 30mm repeat(4, 19mm) 22mm 1fr; font-size: 3.1mm; border-bottom: .2mm solid #d9dfe2; min-height: 7.5mm }
  .dexec > span { padding: 1mm 1.4mm; border-right: .2mm dashed #d9dfe2; display: flex; align-items: center }
  .dexec.h { font-weight: 800; color: var(--muted); border-bottom: .4mm solid var(--brand); min-height: 6mm }
  .dsign { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 5mm; margin-top: 3mm; font-size: 3.2mm }
  .dsign div { border-top: .3mm solid #333; padding-top: 1mm; text-align: center; margin-top: 11mm; color: var(--muted) }
  @media print {
    body { background: #fff }
    .bar, .err { display: none !important }
    .pages { padding: 0; zoom: 1 }
    .sheet { margin: 0; box-shadow: none }
  }
</style>
</head>
<body>
<div class="bar" id="bar" hidden>
  <b>清管作業列印</b>
  <span id="summary"></span>
  <label id="lSheet" hidden><input type="checkbox" id="pSheet" checked> 派工單</label>
  <label id="lCards"><input type="checkbox" id="pCards" checked> 個人任務卡</label>
  <label id="lSkip" hidden><input type="checkbox" id="pSkip" checked> 已發到手機的人不印</label>
  <label id="lCmd"><input type="checkbox" id="pCmd" checked> 指揮總表</label>
  <label><input type="checkbox" id="pList" checked> 準備清單</label>
  <span class="acts">
    <button type="button" id="print">🖨️ 列印</button>
    <button type="button" id="pdf" class="sec">📄 下載 PDF</button>
    <button type="button" id="close" class="sec">✕ 關閉</button>
  </span>
  <p class="help" id="help" hidden>這個畫面（手機主畫面捷徑、LINE 等 App 內建的瀏覽器）沒辦法直接列印。請按「📄 下載 PDF」：
    手機會跳出分享選單，選「列印」或存到檔案再印；電腦會下載 PDF。列印時縮放選「實際大小／100%」。</p>
</div>
<div class="pages" id="pages"></div>
<script>
(function () {
  'use strict';
  function fromB64url(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  // 所有文字都用 textContent，不用 innerHTML（資料來自網址，避免注入）
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    for (var i = 3; i < arguments.length; i++) if (arguments[i]) n.appendChild(arguments[i]);
    return n;
  }
  var pagesEl = document.getElementById('pages'), D = null;
  try { D = JSON.parse(fromB64url(location.hash.slice(1))); } catch (e) { D = null; }
  if (!D || !D.v) {
    pagesEl.appendChild(el('div', 'err', '沒有列印資料。請從一六日誌系統「更多 → 清管範本 → 派工 → 列印」打開這一頁。'));
    return;
  }
  if (D.v !== 2) {
    pagesEl.appendChild(el('div', 'err', '列印資料是舊版的，請回一六日誌系統重新按一次「列印」。'));
    return;
  }
  var P = D.prog || null, steps = P ? P.steps || [] : [], lists = D.lists || [], people = D.people || [], roles = D.roles || {}, phone = D.cards || [];
  var GEO = ['全區', '發射端', '沿線', '接收端'];

  function vpill(valve, action, big) {
    var cls = /關/.test(action) ? 'shut' : (/開/.test(action) ? 'open' : 'other');
    return el('span', 'vp ' + cls + (big ? ' big' : ''), (action ? action + ' ' : '') + valve);
  }
  function stTag(st) { return el('span', 'stg ' + ({ '發射端': 's-launch', '接收端': 's-recv', '沿線': 's-line', '全區': 's-all' }[st] || ''), st); }
  function qtyText(x) {
    if (x.qty === '' || x.qty === null || x.qty === undefined) return '';
    var q = x.qty + (x.unit ? ' ' + x.unit : '');
    return x.calc === '每人' ? q + '／人' : (x.calc === '每趟' ? q + '／趟' : q);
  }
  function short(t, n) { t = String(t || ''); return t.length > n ? t.slice(0, n) + '…' : t; }
  var sheets = [];
  function sheet(title, subBits, extraCls) {
    var s = el('div', 'sheet' + (extraCls ? ' ' + extraCls : ''));
    if (title) {
      var ph = el('div', 'ph', null, el('h1', null, title));
      if (subBits && subBits.length) {
        var sub = el('div', 'sub');
        subBits.forEach(function (b) { if (b) sub.appendChild(b.nodeType ? b : el('span', null, b)); });
        ph.appendChild(sub);
      }
      s.appendChild(ph);
      var body = el('div', 'body');
      s.appendChild(body);
      s.appendChild(el('div', 'pf', null, el('span', null, (D.title || '清管作業') + '　' + (D.date || '')), el('span', 'pno')));
      pagesEl.appendChild(s); sheets.push(s);
      return body;
    }
    pagesEl.appendChild(s); sheets.push(s);
    return s;
  }
  function over(c) { return c.scrollHeight > c.clientHeight + 1; }
  /**
   * 把一串區塊依序放進容器（欄）；放不下就換下一個容器。
   * next()：回傳下一個空容器；cont(b, carried)：換容器時開頭加的「接續」標示
   */
  function flow(blocks, next, cont) {
    var cur = next(), heads = [];   // heads：容器最後面連續的標題（標題要跟著下一個區塊走，不能單獨留在底部）
    blocks.forEach(function (b) {
      cur.appendChild(b.el);
      if (over(cur) && cur.children.length > 1 + heads.length) {
        cur.removeChild(b.el);
        heads.forEach(function (h) { cur.removeChild(h); });
        cur = next();
        var h = cont ? cont(b, heads.length > 0) : null;
        if (h) cur.appendChild(h);
        heads.forEach(function (x) { cur.appendChild(x); });
        cur.appendChild(b.el);
      }
      heads = b.head ? heads.concat([b.el]) : [];
    });
  }

  /* ---------- 崗位、人員 ---------- */
  var roleOrder = Object.keys(roles);
  function posts() {
    var out = [], seen = {}, firstSt = {};
    steps.forEach(function (s, i) {
      if (!s.r) return;
      var k = (s.st || '全區') + '|' + s.r;
      if (!seen[k]) { seen[k] = { key: k, st: s.st || '全區', role: s.r, first: i }; out.push(seen[k]); if (firstSt[seen[k].st] === undefined) firstSt[seen[k].st] = i; }
    });
    function rank(st) { var i = GEO.indexOf(st); return i >= 0 ? i : 10 + firstSt[st]; }
    function rr(p) { var i = roleOrder.indexOf(p.role); return i >= 0 ? i : 1000 + p.first; }
    return out.sort(function (a, b) { return rank(a.st) - rank(b.st) || rr(a) - rr(b); });
  }
  var POSTS = posts(), POST = {};
  POSTS.forEach(function (p, i) { p.i = i; POST[p.key] = p; });
  function postName(k) { var a = String(k).split('|'); return a[0] === '全區' ? a[1] : a[0] + '・' + a[1]; }
  function namesOf(k) { return people.filter(function (x) { return x.p === k; }).map(function (x) { return x.n; }); }
  function keyOf(s) { return (s.st || '全區') + '|' + s.r; }
  function whoText(s) { var n = namesOf(keyOf(s)); return (s.st && s.st !== '全區' ? s.st + ' ' : '') + (s.r || '') + (n.length ? '（' + n.join('、') + '）' : ''); }
  /** 每人一張：有派人的照人合併崗位；沒派人的崗位各一張（名字空白讓現場手寫） */
  function cardsOf() {
    var by = {}, out = [];
    people.slice().sort(function (a, b) { return (POST[a.p] ? POST[a.p].i : 999) - (POST[b.p] ? POST[b.p].i : 999); }).forEach(function (x) {
      if (!POST[x.p]) return;
      if (!by[x.n]) { by[x.n] = { name: x.n, keys: [], notes: [] }; out.push(by[x.n]); }
      if (by[x.n].keys.indexOf(x.p) < 0) by[x.n].keys.push(x.p);
      if (x.note) by[x.n].notes.push((by[x.n].keys.length > 1 ? postName(x.p) + '：' : '') + x.note);
    });
    POSTS.forEach(function (p) { if (!namesOf(p.key).length) out.push({ name: '', keys: [p.key], notes: [] }); });
    if (document.getElementById('pSkip').checked) out = out.filter(function (C) { return !C.name || phone.indexOf(C.name) < 0; });
    return out;
  }
  var CMD = namesOf('全區|指揮官');
  function everyone() {
    var out = [];
    lists.forEach(function (l) { l.items.forEach(function (x) { if (x.calc === '每人' && !x.role) out.push(x.name + (x.qty !== '' && x.qty !== 1 ? ' ' + x.qty + (x.unit || '') : '')); }); });
    return out;
  }

  /* ---------- 個人任務卡 ---------- */

  if (SH) document.getElementById('lSheet').hidden = false;
  if (SH && D.only === 'sheet') ['pCards', 'pCmd', 'pList'].forEach(function (id) { document.getElementById(id).checked = false; });   // 「📋 派工單」：只印派工單（要的話可以再勾）
  if (phone.length && P) document.getElementById('lSkip').hidden = false;
  if (!P || !steps.length) { document.getElementById('lCards').hidden = true; document.getElementById('lCmd').hidden = true; }

  /* ---------- PDF：每頁拍成圖（html2canvas），組成 A4 PDF；手機不能直接列印時用 ---------- */
  function load(url, sri, test) {
    if (test()) return Promise.resolve();
    return new Promise(function (ok, bad) {
      var s = document.createElement('script'); s.src = url; s.integrity = sri; s.crossOrigin = 'anonymous';
      s.onload = ok; s.onerror = function () { bad(new Error('PDF 產生器載入失敗，請確認網路後再試一次')); };
      document.head.appendChild(s);
    });
  }
  function makePdf() {
    return load('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk', function () { return !!window.jspdf; })
      .then(function () { return load('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', 'sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H', function () { return !!window.html2canvas; }); })
      .then(function () {
        var doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', compress: true }), z = getComputedStyle(document.documentElement).getPropertyValue('--z');
        document.documentElement.style.setProperty('--z', '1');
        var i = 0;
        function one() {
          if (i >= sheets.length) { document.documentElement.style.setProperty('--z', z); return doc.output('blob'); }
          var s = sheets[i];
          return window.html2canvas(s, { scale: 2, backgroundColor: '#ffffff', useCORS: false, logging: false }).then(function (cv) {
            if (i) doc.addPage();
            doc.addImage(cv.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
            cv.width = cv.height = 1; i++;
            return one();
          });
        }
        return one();
      });
  }
  var pdfBtn = document.getElementById('pdf');
  pdfBtn.addEventListener('click', function () {
    var old = pdfBtn.textContent;
    pdfBtn.disabled = true; pdfBtn.textContent = '產生中…';
    makePdf().then(function (blob) {
      var d = new Date(), name = (SH ? SH.code + '_' : 'pigging_') + d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2) + '.pdf';
      var file = typeof File === 'function' ? new File([blob], name, { type: 'application/pdf' }) : null;
      var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      if (touch && file && navigator.canShare && navigator.canShare({ files: [file] })) return navigator.share({ files: [file], title: name }).catch(function () { /* 取消 */ });
      var url = URL.createObjectURL(blob), a = el('a');
      a.href = url; a.download = name; a.hidden = true; document.body.appendChild(a); a.click();
      setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 60000);
    }).catch(function (e) { alert(e && e.message || 'PDF 產生失敗，請再試一次'); })
      .then(function () { pdfBtn.disabled = false; pdfBtn.textContent = old; });
  });
  var printing = false, help = document.getElementById('help');
  window.addEventListener('beforeprint', function () { printing = true; });
  document.getElementById('print').addEventListener('click', function () {
    printing = false;
    try { window.print(); } catch (e) { /* 不支援 */ }
    setTimeout(function () { if (!printing) help.hidden = false; }, 1200);
  });
  document.getElementById('close').addEventListener('click', function () {
    try { window.close(); } catch (e) { /* ignore */ }
    setTimeout(function () { if (history.length > 1) history.back(); }, 300);
  });
  document.getElementById('bar').hidden = false;
  render();
})();
</script>
</body>
</html>
